name: Deploy to Cloudflare Pages

on:
  # CI 通过后才部署，避免把未通过测试的代码推到主站
  workflow_run:
    workflows: ['CI（类型检查 / 测试 / 构建 / 浏览器 E2E）']
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages
  cancel-in-progress: true

jobs:
  deploy:
    # 只部署 main 的 push 且 CI 已通过；PR 的 CI 完成不会触发部署
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          # workflow_run 时检出 CI 验证过的那次提交；手动触发时用当前分支
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: 准备 Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: 安装依赖
        run: npm ci

      - name: 构建
        run: npm run build

      - name: 部署到 Cloudflare Pages
        run: npx wrangler@4.152.0 pages deploy dist --project-name=medicine-box --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
