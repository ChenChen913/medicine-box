name: CI（类型检查 / 测试 / 构建 / 浏览器 E2E）

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 同一分支的新提交取消上一次未完成的检查
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: 验证
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 准备 Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 安装依赖
        run: npm ci

      - name: 类型检查（tsc --noEmit）
        run: npm run typecheck

      # npm test 实际包含两套：服务层 170 断言 + UI 逻辑 91 断言（损坏保护 / 输入防御 / 时区 / 属性测试）
      - name: 单元与逻辑测试（261 断言）
        run: npm test

      - name: 代码规范（eslint）
        run: npm run lint

      - name: 构建（vite build）
        run: npm run build

      # 浏览器端验收：响应式 / 无障碍与键盘 / PWA 离线 / 数据安全 / 布局回归 / 历史缺陷回归
      # 依赖 runner 自带的 Chrome（脚本会自动探测；探测不到会以退出码 2 明确报错）
      - name: 浏览器端 E2E（56 项）
        run: npm run test:e2e
        env:
          E2E_CHROME: /usr/bin/google-chrome
