name: AI Code Review (OpenCodeReview)

# 阿里开源 AI 代码评审工具 OpenCodeReview：
# https://github.com/alibaba/open-code-review
#
# 使用前配置（仓库 Settings → Secrets and variables → Actions）：
#   1. 新增 Secret：OCR_API_PROVIDER（可选，默认 dashscope）
#      与 OCR_API_KEY（对应 provider 的 API Key，如 DASHSCOPE_API_KEY 的值）
#   2. 默认仅支持手动触发（workflow_dispatch），不会在无人值守时因缺密钥而报错；
#      配好密钥后，把下方 `if:` 一行注释掉并取消 pull_request 触发的注释，
#      即可对每个 PR 自动做 AI 评审，评审意见会以 PR comment 形式贴出。

on:
  workflow_dispatch:
    inputs:
      base_ref:
        description: '评审基准分支/提交（默认 main）'
        required: false
        default: 'main'
  # pull_request:            # 配好 Secrets 后可取消注释，实现 PR 自动评审
  #   branches: [main]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: code-review-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: ${{ github.event_name == 'workflow_dispatch' && secrets.OCR_API_KEY != '' }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # OCR 需要 git 历史（merge-base / diff）

      - name: 准备 Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 安装 OpenCodeReview
        run: npm install -g @alibaba-group/open-code-review

      - name: 运行 AI 代码评审
        env:
          # provider 通过密钥名约定：OCR_API_PROVIDER 默认 dashscope（通义千问）
          DASHSCOPE_API_KEY: ${{ secrets.OCR_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.OCR_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OCR_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ocr review --from "origin/${{ github.event.inputs.base_ref || 'main' }}" \
                     --to HEAD \
                     --format json --output ocr-result.json || true
          echo "## OpenCodeReview AI 评审结果" > review-summary.md
          if [ -f ocr-result.json ]; then
            python3 - <<'PY'
          import json
          try:
              data = json.load(open('ocr-result.json'))
              comments = data.get('comments') or data.get('issues') or []
              if not comments:
                  print('未发现需要修复的问题 ✔', file=open('review-summary.md','a'))
              for c in comments:
                  file = c.get('file') or c.get('path') or ''
                  line = c.get('line') or ''
                  sev = c.get('severity') or ''
                  body = c.get('comment') or c.get('message') or c.get('body') or ''
                  print(f"- **{file}:{line}** {('#'+str(sev)) if sev else ''} {body}".rstrip(), file=open('review-summary.md','a'))
          except Exception as e:
              print(f'结果解析失败：{e}', file=open('review-summary.md','a'))
          PY
          fi
          cat review-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: 上传评审结果
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ocr-review-result
          path: |
            ocr-result.json
            review-summary.md
          if-no-files-found: ignore
