name: AI Code Review (OpenCodeReview)

# 阿里开源 AI 代码评审工具 OpenCodeReview：
# https://github.com/alibaba/open-code-review
#
# 使用前配置（仓库 Settings → Secrets and variables → Actions）：
#   1. 新增 Secret：OCR_API_KEY（provider 的 API Key；
#      默认 provider 为 dashscope 通义千问，也可在下方步骤中换 DEEPSEEK_API_KEY 等）
#   2. 本工作流仅手动触发（Actions → AI Code Review → Run workflow），
#      配好密钥后选择基准分支运行；未配密钥时手动运行会优雅跳过、不会报错。
#   3. 若想对每个 PR 自动评审：把下方 pull_request 两行注释打开即可。

on:
  workflow_dispatch:
    inputs:
      base_ref:
        description: '评审基准分支/提交（默认 main）'
        required: false
        default: 'main'
  # pull_request:            # 配好 Secrets 后可取消注释，实现 PR 自动评审
  #   branches: [main]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: code-review-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # 注意：secrets 上下文不能用在 job 级 if（会导致 startup failure），
    # 密钥检查放在 gate 步骤里做
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # OCR 需要 git 历史（merge-base / diff）

      - name: 检查 API 密钥
        id: gate
        env:
          OCR_KEY: ${{ secrets.OCR_API_KEY }}
        run: |
          if [ -z "$OCR_KEY" ]; then
            echo "未配置 OCR_API_KEY secret，跳过评审。配置方法见本文件头部注释。"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 准备 Node
        if: steps.gate.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 安装 OpenCodeReview
        if: steps.gate.outputs.skip != 'true'
        run: npm install -g @alibaba-group/open-code-review

      - name: 运行 AI 代码评审
        if: steps.gate.outputs.skip != 'true'
        env:
          # 默认按 dashscope（通义千问）注入；换其它 provider 时同步改下方变量名与 ocr config
          DASHSCOPE_API_KEY: ${{ secrets.OCR_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ocr review --from "origin/${{ github.event.inputs.base_ref || 'main' }}" \
                     --to HEAD \
                     --format json --output ocr-result.json || true
          echo "## OpenCodeReview AI 评审结果" > review-summary.md
          if [ -f ocr-result.json ]; then
            python3 - <<'PY'
          import json
          try:
              data = json.load(open('ocr-result.json'))
              comments = data.get('comments') or data.get('issues') or []
              if not comments:
                  print('未发现需要修复的问题 ✔', file=open('review-summary.md','a'))
              for c in comments:
                  file = c.get('file') or c.get('path') or ''
                  line = c.get('line') or ''
                  sev = c.get('severity') or ''
                  body = c.get('comment') or c.get('message') or c.get('body') or ''
                  print(f"- **{file}:{line}** {('#'+str(sev)) if sev else ''} {body}".rstrip(), file=open('review-summary.md','a'))
          except Exception as e:
              print(f'结果解析失败：{e}', file=open('review-summary.md','a'))
          PY
          fi
          cat review-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: 上传评审结果
        if: always() && steps.gate.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ocr-review-result
          path: |
            ocr-result.json
            review-summary.md
          if-no-files-found: ignore
