name: Deploy to GitHub Pages

on:
  # 与主站一样，只有 CI 通过的 main 提交才部署备用站
  workflow_run:
    workflows: ['CI（类型检查 / 测试 / 构建 / 浏览器 E2E）']
    types: [completed]
    branches: [main]
  workflow_dispatch:

# 允许 GitHub Actions 部署 Pages
permissions:
  contents: read
  pages: write
  id-token: write

# 同时只允许一次部署，排队中的会被取消
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    # 防止异常情况下任务无限占用 runner 资源
    timeout-minutes: 10
    steps:
      - name: 检出代码
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: 准备 Node
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: 安装依赖
        run: npm ci

      - name: 构建
        run: npm run build
        env:
          # 从仓库 Secrets 读取；没配置也能构建成功，只是降级为本地存储
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      # 优先保留 public/404.html 自定义页；缺失时才用入口页兜底
      - name: 检查 404 页面
        run: |
          if [ ! -f dist/404.html ]; then
            cp dist/index.html dist/404.html
          fi

      - name: 配置 Pages
        uses: actions/configure-pages@v6

      - name: 上传构建产物
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
